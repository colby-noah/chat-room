# deploy/nginx.conf
upstream chat_rest { server backend:8080; }
upstream chat_ws   { server backend:8081; }

# Redirect plain HTTP to HTTPS (WebSocket clients must connect with wss:// directly)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/chat.crt;
    ssl_certificate_key /etc/nginx/certs/chat.key;
    
    # Frontend
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri /index.html;
    }

    # REST API (HTTPS upstream)
    location /rest/ {
        proxy_pass https://chat_rest/;
    }

    # WebSockets server (WSS upstream)
    location /ws/ {
        proxy_pass https://chat_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # Keep idle chat connections open
    }
}

